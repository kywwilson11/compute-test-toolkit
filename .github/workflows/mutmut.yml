# Nightly mutation-testing run, SHARDED across the six scoped logic modules
# (ber / bert / aer / linkstate / topology / diagnostics). Each module is its own
# parallel job, so wall-clock = max(per-module) ≈ 30–45 min instead of the
# ~3 h sum-of-modules that hit the timeout when this ran serially.
#
# Why six jobs and not just one bigger timeout? The previous single-runner
# layout hit the 2h30m runner cap before clearing ber.py, with the other five
# modules untouched. Sharding finishes inside a tight per-shard budget AND
# lets a single hung mutant in one module not torch the rest's signal.
#
# Each shard uploads its own named `.mutmut-cache` artifact (mutmut-cache-<module>)
# so a triager can download just the one they care about. The cache files are
# independent SQLite databases — mutmut tracks "which mutations of WHICH file"
# inside, so each shard's cache is the authoritative record for its module.
#
# Triggered nightly (07:00 UTC, off-peak) and on workflow_dispatch.
name: mutmut

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: toolkit

jobs:
  mutmut:
    runs-on: ubuntu-latest
    # This lane REPORTS mutation survivors; it does not gate. Survivors are expected
    # on any real codebase, so `continue-on-error` keeps the workflow-run conclusion
    # green (no failure email) whether mutants survive OR a shard hits its timeout.
    # The signal lives in the run Summary tab + the uploaded cache, triaged weekly.
    continue-on-error: true
    # Per-shard budget. ~6 s/mutant avg (fast-killed + full-suite survivors) ×
    # the largest module (bert.py ~347 mutants). bert can still brush 90 min when it
    # has many survivors (each re-runs the full suite) -- tolerated via the above.
    # fail-fast disabled so one shard's timeout doesn't cancel the others' signal.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # `include` lets us name shards (used in the artifact name) without
        # tying the artifact key to a filesystem-unfriendly source path.
        include:
          - name: ber
            module: src/computetest/ber.py
          - name: bert
            module: src/computetest/bert.py
          - name: aer
            module: src/computetest/aer.py
          - name: linkstate
            module: src/computetest/linkstate.py
          - name: topology
            module: src/computetest/topology.py
          - name: diagnostics
            module: src/computetest/diagnostics.py
    env:
      COMPUTETEST_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dev deps
        run: python -m pip install -e '.[dev]'
      - name: Run mutmut on ${{ matrix.name }} (${{ matrix.module }})
        # `--paths-to-mutate` overrides the setup.cfg list to this single module.
        # mutmut exits non-zero when mutants survive; that's an expected report
        # outcome, not a build break, so the job's continue-on-error swallows it.
        # The survivor list is surfaced in the summary step below + the cache artifact.
        run: python -m mutmut run --paths-to-mutate ${{ matrix.module }}
      - name: Report surviving mutants for ${{ matrix.name }}
        if: always()
        # Surface the survivor list in the run's Summary tab so weekly triage
        # doesn't have to dig through job logs.
        run: |
          {
            echo "### mutmut — ${{ matrix.name }} (\`${{ matrix.module }}\`)"
            echo '```'
            python -m mutmut results || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload .mutmut-cache for ${{ matrix.name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-cache-${{ matrix.name }}
          path: toolkit/.mutmut-cache
          include-hidden-files: true   # .mutmut-cache is a dotfile; upload-artifact@v4 skips hidden by default
          if-no-files-found: ignore
