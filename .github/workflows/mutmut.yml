# Nightly mutation-testing run (separate from PR CI — the suite-per-mutant cost is too
# high for every PR even with a fast 13 s suite). Scoped via setup.cfg [mutmut] to the
# six decision/math/logic modules the mock suite fully exercises (ber, bert, aer,
# linkstate, topology, diagnostics) — the thin real-hardware wrappers are excluded.
name: mutmut

on:
  schedule:
    - cron: '0 7 * * *'      # 07:00 UTC daily (off-peak)
  workflow_dispatch:

defaults:
  run:
    working-directory: toolkit

jobs:
  mutmut:
    runs-on: ubuntu-latest
    # 1264 mutants × ~5 s avg (mix of fast-kills and full-suite survivors) ≈ 105 min
    # sequential; 150 min is ~150 % of expected, with budget for the test suite
    # widening over time. Runs in the middle of the night, so the long wall-clock
    # is harmless. (If this ever grows past a single 6-hour job we can shard by
    # module across 6 parallel jobs -- they don't share state.)
    timeout-minutes: 150
    env:
      COMPUTETEST_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dev deps
        run: python -m pip install -e '.[dev]'
      - name: Run mutation testing
        # mutmut exits non-zero when any mutant survives — that's the signal we want.
        run: python -m mutmut run
      - name: Show surviving mutants
        if: always()
        run: python -m mutmut results || true
      - name: Upload .mutmut-cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-cache
          path: toolkit/.mutmut-cache
          if-no-files-found: ignore
