# No-hardware test lane (the design doc's "Phase 0/1 — macOS + Linux, no privilege").
# Runs on every push/PR. Three jobs, parallel:
#   lint       ruff + mypy gate (fast; surfaces broken style/types before the matrix)
#   test       pytest + coverage gate (--fail-under from pyproject) across the OS/Python matrix
#   c-tests    the Unity C unit tests for the BERT engine (matches `make ctest`)
# The privileged Phase 2/3 QEMU lane lives in qemu.yml.
name: test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: toolkit

jobs:
  # Fast static-analysis gate — fails the workflow early if style or types regress.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dev deps
        run: python -m pip install -e '.[dev]'
      - name: ruff
        run: python -m ruff check src tests
      - name: mypy
        run: python -m mypy src

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      # All tests are designed against the deterministic mock backend; real hardware
      # paths are covered by the QEMU lane (qemu.yml).
      COMPUTETEST_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dev deps
        run: python -m pip install -e '.[dev]'
      - name: pytest with coverage
        # branch=true and exclude_lines/fail_under come from pyproject [tool.coverage.*].
        run: |
          python -m coverage run -m pytest
          python -m coverage report -m

  c-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run Unity unit tests
        run: make ctest
