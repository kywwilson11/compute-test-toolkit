[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "computetest"
version = "0.1.0"
description = "Compute-platform manufacturing-test toolkit: PCIe BERT + diagnostics, NVMe/GPU/GMSL/Ethernet checks, harness, dashboard."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sci = ["scipy"]                      # faster/exacter BER math (a pure-python fallback ships built in)
yaml = ["pyyaml"]                    # YAML test plans (JSON works without it)
dashboard = ["fastapi", "uvicorn"]   # the results dashboard
# Single source of truth for what `pip install -e .[dev]` brings in for CI + local.
# mutmut pinned to 2.x: 3.x rewrote the config/runner model; we use the 2.x [mutmut] format.
dev = ["pytest", "hypothesis", "coverage", "ruff", "mypy", "mutmut<3", "pyyaml"]

[project.scripts]
computetest = "computetest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

# Coverage: run via `python -m coverage run -m pytest && python -m coverage report -m`.
# branch=true so an untaken if/else half is flagged, not just unexecuted lines.
[tool.coverage.run]
branch = true
source = ["src/computetest"]

[tool.coverage.report]
show_missing = true
# CI gate: we sit at ~98% currently; 95% leaves a small honest buffer for the real-hw
# paths whose coverage swings when corpus seeds change.
fail_under = 95
exclude_lines = [
    "pragma: no cover",                 # real-hardware sysfs/subprocess paths (run on the bench)
    "if __name__ == .__main__.:",       # module demos
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# --- ruff: defaults + import-sort + bugbear; tests opt out of E741 (short loop vars). -----
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F/W = pycodestyle/pyflakes basics; I = import sorting; B = bugbear (catches real bugs);
# UP = pyupgrade (keep us on modern Python idioms).
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests sometimes intentionally do unused-imports (fixture side-effects) or single-letter vars.
"tests/**" = ["E741"]

# --- mypy: scope to src, strict optional; scipy/uvicorn have no stubs upstream. ----------
[tool.mypy]
python_version = "3.10"
files = ["src"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["scipy.*", "uvicorn", "fastapi", "fastapi.*"]
ignore_missing_imports = true
