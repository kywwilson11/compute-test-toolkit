[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "computetest"
version = "0.1.0"
description = "Compute-platform manufacturing-test toolkit: PCIe BERT + diagnostics, NVMe/GPU/GMSL/Ethernet checks, harness, dashboard."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sci = ["scipy"]                      # faster/exacter BER math (a pure-python fallback ships built in)
yaml = ["pyyaml"]                    # YAML test plans (JSON works without it)
dashboard = ["fastapi", "uvicorn"]   # the results dashboard
dev = ["pytest"]

[project.scripts]
computetest = "computetest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

# Coverage: run via `python -m coverage run -m pytest && python -m coverage report -m`.
# branch=true so an untaken if/else half is flagged, not just unexecuted lines.
[tool.coverage.run]
branch = true
source = ["src/computetest"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",                 # real-hardware sysfs/subprocess paths (run on the bench)
    "if __name__ == .__main__.:",       # module demos
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
