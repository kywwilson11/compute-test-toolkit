# Mutation testing (mutmut). Run:  python -m mutmut run   then   python -m mutmut results
# Scoped to the decision/math/logic modules whose behavior the mock suite fully exercises.
# The thin real-hardware I/O wrappers (backend sysfs reads, gmsl/nvme/gpu/memory device
# paths) are validated on the bench, not by mutation, so they're left out to avoid
# meaningless "survived" mutants on lines the mock can't run.
[mutmut]
paths_to_mutate=src/computetest/ber.py,src/computetest/bert.py,src/computetest/aer.py,src/computetest/linkstate.py,src/computetest/topology.py,src/computetest/diagnostics.py
tests_dir=tests/
runner=python3 -m pytest -x -q
